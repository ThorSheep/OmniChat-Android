name: Build Android prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        default: v0.1.0
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build debug APK
        run: bash ./gradlew --no-daemon :app:assembleDebug

      - name: Prepare APK and checksum
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected tag vMAJOR.MINOR.PATCH'; exit 1; }
          version=$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/debug/output-metadata.json"))["elements"][0]["versionName"])')
          [[ "$RELEASE_TAG" == "v$version" ]] || { echo 'Tag must match Android versionName'; exit 1; }
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/OmniChat-$RELEASE_TAG-debug.apk"
          (cd release-assets && sha256sum "OmniChat-$RELEASE_TAG-debug.apk" > SHA256SUMS.txt)

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          notes="docs/releases/$RELEASE_TAG.md"
          test -f "$notes"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "OmniChat $RELEASE_TAG — Android 測試版" --notes-file "$notes" --prerelease
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "OmniChat $RELEASE_TAG — Android 測試版" --notes-file "$notes" --prerelease --latest=false
          fi
